<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食管理 - スタッフ画面</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

  <header class="bg-emerald-700 text-white p-4 flex justify-between items-center shadow-md">
    <h1 class="font-bold text-lg">⚙️ 学食スタッフ管理画面（リアルタイム）</h1>
    <button id="clearBtn" class="bg-emerald-900 hover:bg-emerald-950 text-xs px-3 py-1.5 rounded text-emerald-100">
      全注文消去
    </button>
  </header>

  <!-- タブナビゲーション -->
  <div class="bg-white border-b shadow-sm">
    <div class="max-w-4xl mx-auto flex">
      <button id="tabOrdersBtn" onclick="switchTab('orders')" class="flex-1 py-3 text-center font-bold text-sm text-emerald-700 border-b-2 border-emerald-700 focus:outline-none">
        📋 注文管理
      </button>
      <button id="tabMenuBtn" onclick="switchTab('menu')" class="flex-1 py-3 text-center font-bold text-sm text-gray-500 border-b-2 border-transparent hover:text-emerald-700 focus:outline-none">
        🍔 メニュー管理・価格変更
      </button>
      <button id="tabAddBtn" onclick="switchTab('add')" class="flex-1 py-3 text-center font-bold text-sm text-gray-500 border-b-2 border-transparent hover:text-emerald-700 focus:outline-none">
        ➕ 新商品追加
      </button>
    </div>
  </div>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4">
    
    <!-- タブ1: 注文管理 -->
    <div id="tabOrders" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <section class="bg-white p-4 rounded-xl border shadow-sm">
        <h2 class="text-md font-bold mb-3 text-orange-600 flex justify-between">
          <span>🍳 調理中</span>
          <span id="countPreparing" class="bg-orange-100 text-orange-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div id="preparingList" class="space-y-3"></div>
      </section>

      <section class="bg-white p-4 rounded-xl border shadow-sm">
        <h2 class="text-md font-bold mb-3 text-green-600 flex justify-between">
          <span>🔔 呼び出し中</span>
          <span id="countReady" class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div id="readyList" class="space-y-3"></div>
      </section>
    </div>

    <!-- タブ2: メニュー管理（アイコン・価格変更・売り切れ・削除） -->
    <div id="tabMenu" class="hidden bg-white p-6 rounded-xl border shadow-sm">
      <h2 class="text-md font-bold mb-4 text-gray-800">🍔 商品一覧・アイコン / 価格 / 状態設定</h2>
      <div id="menuList" class="space-y-3">
        <p class="text-xs text-gray-400 py-4 text-center">読み込み中...</p>
      </div>
    </div>

    <!-- タブ3: 新商品追加 -->
    <div id="tabAdd" class="hidden bg-white p-6 rounded-xl border shadow-sm max-w-md mx-auto">
      <h2 class="text-md font-bold mb-4 text-gray-800">➕ 新商品の追加</h2>
      <form id="addProductForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">アイコン（食べ物から選択）</label>
          <input type="hidden" id="newProductEmoji" value="🍱">
          <div id="emojiPicker" class="grid grid-cols-8 gap-1.5 p-2 bg-gray-50 border rounded-lg">
            <!-- JSで食べ物絵文字一覧を表示 -->
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">商品名</label>
          <input type="text" id="newProductName" required placeholder="例: 唐揚げ定食" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">金額 (円)</label>
          <input type="number" id="newProductPrice" required min="0" placeholder="例: 500" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
          商品を登録する
        </button>
      </form>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ53Gowy1BoIXT5nGLC_MdFJ3vpfqiGp0",
      authDomain: "school-order-app.firebaseapp.com",
      databaseURL: "https://school-order-app-default-rtdb.firebaseio.com",
      projectId: "school-order-app",
      storageBucket: "school-order-app.firebasestorage.app",
      messagingSenderId: "1030918225373",
      appId: "1:1030918225373:web:353c77fecd49d4a94f8a34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 食べ物系絵文字リスト
    const FOOD_EMOJIS = ['🍱', '🍜', '🍛', '🍙', '🥪', '🍟', '🍔', '🥗', '🍝', '🍢', '🥟', '🍤', '🥐', '🍦', '🍩', '🧃'];

    // 新規登録用の絵文字ピッカー初期化
    const emojiPicker = document.getElementById('emojiPicker');
    const newProductEmojiInput = document.getElementById('newProductEmoji');

    FOOD_EMOJIS.forEach((e, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `p-2 text-xl rounded transition hover:bg-emerald-100 ${idx === 0 ? 'bg-emerald-200 ring-2 ring-emerald-500' : 'bg-white'}`;
      btn.innerText = e;
      btn.onclick = () => {
        newProductEmojiInput.value = e;
        Array.from(emojiPicker.children).forEach(child => {
          child.className = 'p-2 text-xl rounded transition hover:bg-emerald-100 bg-white';
        });
        btn.className = 'p-2 text-xl rounded transition hover:bg-emerald-100 bg-emerald-200 ring-2 ring-emerald-500';
      };
      emojiPicker.appendChild(btn);
    });

    // タブ切り替え
    window.switchTab = (tabName) => {
      const tabs = ['orders', 'menu', 'add'];
      tabs.forEach(t => {
        const content = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
        const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`);
        
        if (t === tabName) {
          content.classList.remove('hidden');
          btn.classList.add('text-emerald-700', 'border-emerald-700');
          btn.classList.remove('text-gray-500', 'border-transparent');
        } else {
          content.classList.add('hidden');
          btn.classList.remove('text-emerald-700', 'border-emerald-700');
          btn.classList.add('text-gray-500', 'border-transparent');
        }
      });
    };

    // 注文ステータス更新・消去
    window.updateStatus = (orderId, newStatus) => {
      update(ref(db, `orders/${orderId}`), { status: newStatus });
    };

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm("すべての注文データを削除しますか？カウンターもリセットされます。")) {
        remove(ref(db, 'orders'));
        remove(ref(db, 'orderCounter'));
      }
    });

    // 注文リストリアルタイム表示
    onValue(ref(db, 'orders'), (snapshot) => {
      const data = snapshot.val() || {};
      const preparingContainer = document.getElementById('preparingList');
      const readyContainer = document.getElementById('readyList');

      const orders = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      orders.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      const preparingOrders = orders.filter(o => o.status === 'preparing');
      const readyOrders = orders.filter(o => o.status === 'ready');

      document.getElementById('countPreparing').innerText = preparingOrders.length;
      document.getElementById('countReady').innerText = readyOrders.length;

      preparingContainer.innerHTML = preparingOrders.length === 0 ? '<p class="text-xs text-gray-400 py-4 text-center">調理待ちなし</p>' : 
        preparingOrders.map(o => `
          <div class="border-l-4 border-orange-500 bg-orange-50/50 p-3 rounded-r-lg border shadow-sm space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-2xl font-black text-gray-800">${o.orderNumber}</span>
              <span class="bg-orange-200 text-orange-900 text-xs px-2 py-1 rounded font-bold">${o.studentInfo}</span>
            </div>
            <div class="flex justify-between items-center text-xs text-gray-600">
              <div>${(o.items || []).map(i => `<span>・${i.name} (¥${i.price})</span>`).join('')}</div>
              <span class="bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded font-semibold">${o.paymentMethod || '未選択'}</span>
            </div>
            <button onclick="window.updateStatus('${o.id}', 'ready')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg text-xs transition">
              🔔 呼び出し通知を送る
            </button>
          </div>
        `).join('');

      readyContainer.innerHTML = readyOrders.length === 0 ? '<p class="text-xs text-gray-400 py-4 text-center">呼び出し中なし</p>' : 
        readyOrders.map(o => `
          <div class="border-l-4 border-green-500 bg-green-50/50 p-3 rounded-r-lg border shadow-sm space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-2xl font-black text-green-700">${o.orderNumber}</span>
              <span class="bg-green-200 text-green-900 text-xs px-2 py-1 rounded font-bold">${o.studentInfo}</span>
            </div>
            <div class="flex justify-between items-center text-xs text-gray-600">
              <div>${(o.items || []).map(i => `<span>・${i.name}</span>`).join('')}</div>
              <span class="bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded font-semibold">${o.paymentMethod || '未選択'}</span>
            </div>
            <button onclick="window.updateStatus('${o.id}', 'completed')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg text-xs transition">
              ✅ 提供完了
            </button>
          </div>
        `).join('');
    });

    // --------------------------------------------------
    // メニュー管理（アイコンドロップダウン変更・売り切れ・価格変更・削除）
    // --------------------------------------------------
    window.toggleSoldOut = (menuId, currentStatus) => {
      update(ref(db, `menu/${menuId}`), { isSoldOut: !currentStatus });
    };

    window.updateProductInfo = (menuId) => {
      const emojiSelect = document.getElementById(`emoji-select-${menuId}`);
      const priceInput = document.getElementById(`price-input-${menuId}`);
      
      const newEmoji = emojiSelect.value;
      const newPrice = parseInt(priceInput.value, 10);

      if (isNaN(newPrice) || newPrice < 0) {
        alert("正しい金額を入力してください。");
        return;
      }

      update(ref(db, `menu/${menuId}`), { 
        emoji: newEmoji,
        price: newPrice 
      }).then(() => {
        alert("商品情報を更新しました。");
      });
    };

    window.deleteProduct = (menuId, productName) => {
      if (confirm(`「${productName}」を完全に削除しますか？`)) {
        remove(ref(db, `menu/${menuId}`)).then(() => {
          alert("商品を削除しました。");
        });
      }
    };

    onValue(ref(db, 'menu'), (snapshot) => {
      const data = snapshot.val() || {};
      const menuContainer = document.getElementById('menuList');
      const menuKeys = Object.keys(data);

      if (menuKeys.length === 0) {
        menuContainer.innerHTML = '<p class="text-xs text-gray-400 py-4 text-center">登録されている商品がありません。</p>';
        return;
      }

      menuContainer.innerHTML = menuKeys.map(key => {
        const item = data[key];
        const isSoldOut = item.isSoldOut || false;
        const emoji = item.emoji || '🍱';

        const emojiOptionsHtml = FOOD_EMOJIS.map(e => `
          <option value="${e}" ${e === emoji ? 'selected' : ''}>${e}</option>
        `).join('');

        return `
          <div class="p-3 border rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-3 bg-gray-50">
            <div class="flex items-center gap-2">
              <select id="emoji-select-${key}" class="text-lg bg-white border rounded p-1">
                ${emojiOptionsHtml}
              </select>
              <span class="font-bold text-gray-800 text-sm">${item.name}</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex items-center text-xs text-gray-500">
                ¥<input type="number" id="price-input-${key}" defaultValue="${item.price}" class="w-20 border rounded p-1 text-xs text-right ml-1">
              </div>
              <button onclick="window.updateProductInfo('${key}')" class="bg-gray-700 hover:bg-gray-800 text-white text-xs px-2.5 py-1.5 rounded font-bold">
                更新
              </button>
              <button onclick="window.toggleSoldOut('${key}', ${isSoldOut})" class="text-xs px-3 py-1.5 rounded font-bold text-white ${isSoldOut ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-600 hover:bg-emerald-700'}">
                ${isSoldOut ? '売り切れ中' : '販売中'}
              </button>
              <button onclick="window.deleteProduct('${key}', '${item.name}')" class="bg-gray-200 hover:bg-red-100 text-red-600 text-xs px-2.5 py-1.5 rounded font-bold transition">
                🗑 削除
              </button>
            </div>
          </div>
        `;
      }).join('');
    });

    // 新商品追加処理
    document.getElementById('addProductForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const emoji = newProductEmojiInput.value || '🍱';
      const nameInput = document.getElementById('newProductName');
      const priceInput = document.getElementById('newProductPrice');

      const name = nameInput.value.trim();
      const price = parseInt(priceInput.value, 10);

      if (!name || isNaN(price) || price < 0) {
        alert("正しく入力してください。");
        return;
      }

      const newMenuRef = push(ref(db, 'menu'));
      set(newMenuRef, {
        emoji: emoji,
        name: name,
        price: price,
        isSoldOut: false
      }).then(() => {
        alert(`「${name}」を追加しました。`);
        nameInput.value = '';
        priceInput.value = '';
        switchTab('menu');
      });
    });
  </script>
</body>
</html>
