<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食モバイルオーダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { animation: { 'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite' } } }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

  <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
    <h1 class="font-bold text-lg md:text-xl">🍱 学食モバイルオーダー</h1>
    <button id="logoutBtn" class="hidden text-xs bg-blue-700 hover:bg-blue-800 text-white font-bold py-1 px-3 rounded-lg border border-blue-400">
      ログアウト
    </button>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24">
    <div id="activeOrdersContainer" class="space-y-4 mb-6"></div>

    <!-- 認証エリア -->
    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-6">
      <!-- 未ログイン時の表示 -->
      <div id="loginSection" class="text-center py-2">
        <h2 class="text-md font-bold mb-2 text-gray-800">👤 学校アカウントでログイン</h2>
        <p class="text-xs text-gray-500 mb-4">注文には学校指定のGoogleアカウント（@school.ed.jp）が必要です。</p>
        <button id="googleLoginBtn" class="w-full sm:w-auto bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-2.5 px-6 rounded-xl shadow-sm inline-flex items-center justify-center gap-2 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google アカウントでログイン
        </button>
      </div>

      <!-- ログイン完了時の表示 -->
      <div id="userInfoSection" class="hidden flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-lg" id="userAvatar">
            👤
          </div>
          <div>
            <p class="text-xs text-gray-500">注文者アカウント</p>
            <p id="userNameDisplay" class="font-bold text-gray-800 text-sm"></p>
            <p id="userEmailDisplay" class="text-xs text-blue-600 font-semibold"></p>
          </div>
        </div>
        <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-full">認証済み</span>
      </div>
    </div>

    <!-- メニューセクション -->
    <div id="menuSection">
      <h2 class="text-lg font-bold mb-3 text-gray-800">🍱 メニュー選択</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="menuList"></div>
    </div>
  </main>

  <!-- カートバー -->
  <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-2xl z-40 hidden">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500" id="cartCount">合計 0 点</p>
        <p class="text-xl font-bold text-blue-600" id="cartTotal">¥0</p>
      </div>
      <button id="openPaymentBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md">
        お支払いへ進む
      </button>
    </div>
  </div>

  <!-- 決済モーダル -->
  <div id="paymentModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-center text-gray-800">決済方法を選択</h3>
      <p class="text-xs text-gray-500 text-center">お支払い方法を選択して注文を確定します。</p>

      <div class="space-y-3">
        <button onclick="window.confirmOrder('PayPay')" class="w-full bg-red-500 hover:bg-red-600 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition text-center text-lg">
          PayPay で支払う
        </button>

        <button onclick="window.confirmOrder('au PAY')" class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition text-center text-lg">
          au PAY で支払う
        </button>
      </div>

      <button id="closePaymentBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 rounded-xl text-sm transition">
        キャンセル
      </button>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyAZ53Gowy1BoIXT5nGLC_MdFJ3vpfqiGp0",
      authDomain: "school-order-app.firebaseapp.com",
      databaseURL: "https://school-order-app-default-rtdb.firebaseio.com",
      projectId: "school-order-app",
      storageBucket: "school-order-app.firebasestorage.app",
      messagingSenderId: "1030918225373",
      appId: "1:1030918225373:web:353c77fecd49d4a94f8a34"
    };

    // 制限対象の学校ドメイン（※実際の学校のドメインに変更してください）
    const ALLOWED_DOMAIN = "school.ed.jp";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ hd: ALLOWED_DOMAIN });

    let currentUser = null;
    let cart = [];
    let myOrderIds = JSON.parse(localStorage.getItem('firebase_student_order_ids') || '[]');

    const MENU_ITEMS = [
      { id: 1, name: '冷やしうどん', price: 360, emoji: '🍜' }
    ];

    // UI要素の取得
    const loginSection = document.getElementById('loginSection');
    const userInfoSection = document.getElementById('userInfoSection');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // ログイン処理
    googleLoginBtn.addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // ドメインチェック
        if (!user.email.endsWith(`@${ALLOWED_DOMAIN}`)) {
          alert(`許可されていないアカウントです。@${ALLOWED_DOMAIN} のメールアドレスでログインしてください。`);
          await signOut(auth);
        }
      } catch (error) {
        console.error("ログインエラー:", error);
        alert("ログインに失敗しました。");
      }
    });

    // ログアウト処理
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      alert("ログアウトしました。");
    });

    // 認証状態の監視
    onAuthStateChanged(auth, (user) => {
      if (user && user.email.endsWith(`@${ALLOWED_DOMAIN}`)) {
        currentUser = user;
        userNameDisplay.innerText = user.displayName || '生徒';
        userEmailDisplay.innerText = user.email;
        loginSection.classList.add('hidden');
        userInfoSection.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
      } else {
        currentUser = null;
        loginSection.classList.remove('hidden');
        userInfoSection.classList.add('hidden');
        logoutBtn.classList.add('hidden');
      }
    });

    // メニュー表示
    const list = document.getElementById('menuList');
    list.innerHTML = MENU_ITEMS.map(item => `
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-3xl">${item.emoji}</span>
          <div>
            <p class="font-bold text-gray-800">${item.name}</p>
            <p class="text-blue-600 font-semibold">¥${item.price}</p>
          </div>
        </div>
        <button onclick="window.addToCart(${item.id})" class="bg-blue-50 text-blue-600 font-bold px-4 py-2 rounded-lg text-sm hover:bg-blue-100">
          ＋ 追加
        </button>
      </div>
    `).join('');

    window.addToCart = (itemId) => {
      const item = MENU_ITEMS.find(i => i.id === itemId);
      if (item) { cart.push(item); updateCartUI(); }
    };

    function updateCartUI() {
      const bar = document.getElementById('cartBar');
      if (cart.length === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      document.getElementById('cartCount').innerText = `合計 ${cart.length} 点`;
      document.getElementById('cartTotal').innerText = `¥${cart.reduce((sum, item) => sum + item.price, 0)}`;
    }

    const modal = document.getElementById('paymentModal');
    document.getElementById('openPaymentBtn').addEventListener('click', () => {
      if (!currentUser) {
        alert('注文するには、学校のアカウントでログインしてください。');
        return;
      }
      modal.classList.remove('hidden');
    });

    document.getElementById('closePaymentBtn').addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    window.confirmOrder = (paymentMethod) => {
      if (cart.length === 0 || !currentUser) return;

      if (paymentMethod === 'PayPay') {
        const pendingOrder = {
          items: cart,
          paymentMethod: 'PayPay'
        };
        sessionStorage.setItem('pending_paypay_order', JSON.stringify(pendingOrder));
        window.location.href = "https://qr.paypay.ne.jp/p2p01_a2ZopZe9E0oZdWWc";
        return;
      }

      executeOrderCreation(cart, paymentMethod);
    };

    function executeOrderCreation(orderItems, paymentMethod) {
      if (!currentUser) return;

      const counterRef = ref(db, 'orderCounter');

      runTransaction(counterRef, (currentValue) => {
        return (currentValue || 0) + 1;
      }).then((result) => {
        const nextNum = result.snapshot.val();
        const formattedNum = String(nextNum).padStart(3, '0');
        const orderNum = `ORD-${formattedNum}`;

        const newOrder = {
          orderNumber: orderNum,
          studentInfo: `${currentUser.displayName} (${currentUser.email})`,
          userEmail: currentUser.email,
          userId: currentUser.uid,
          items: orderItems,
          paymentMethod: paymentMethod,
          status: 'preparing',
          timestamp: Date.now()
        };

        const newOrderRef = push(ref(db, 'orders'), newOrder);
        myOrderIds.push(newOrderRef.key);
        localStorage.setItem('firebase_student_order_ids', JSON.stringify(myOrderIds));

        cart = [];
        updateCartUI();
        modal.classList.add('hidden');
        listenMyOrders();
      }).catch((err) => {
        console.error("注文処理エラー:", err);
      });
    }

    function checkPendingPayPayOrder() {
      const pendingData = sessionStorage.getItem('pending_paypay_order');
      if (pendingData && currentUser) {
        const pendingOrder = JSON.parse(pendingData);
        sessionStorage.removeItem('pending_paypay_order');
        executeOrderCreation(pendingOrder.items, pendingOrder.paymentMethod);
      }
    }

    function listenMyOrders() {
      if (myOrderIds.length === 0) return;
      onValue(ref(db, 'orders'), (snapshot) => {
        const allOrders = snapshot.val() || {};
        const container = document.getElementById('activeOrdersContainer');
        container.innerHTML = '';

        myOrderIds.forEach(id => {
          const order = allOrders[id];
          if (order && order.status !== 'completed') {
            const isReady = order.status === 'ready';
            const card = document.createElement('div');
            card.className = `rounded-2xl p-6 text-center border shadow-lg ${isReady ? 'bg-green-50 border-green-400 text-green-900 animate-pulse-fast' : 'bg-white border-blue-200'}`;
            card.innerHTML = `
              <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>注文者：${order.studentInfo}</span>
                <span class="font-bold text-gray-700">${order.paymentMethod || '未選択'}決済</span>
              </div>
              <h3 class="text-xl font-bold mb-3 ${isReady ? 'text-green-700' : 'text-blue-600'}">
                ${isReady ? '🎉 料理の準備ができました！' : '⏳ 調理中です...'}
              </h3>
              <div class="inline-block bg-white px-6 py-3 rounded-2xl shadow-inner mb-2 border">
                <span class="text-xs text-gray-400 block">受取番号</span>
                <span class="text-5xl font-black ${isReady ? 'text-green-600' : 'text-gray-800'}">${order.orderNumber}</span>
              </div>
              <div class="text-xs text-gray-600 mt-2">
                ${order.items.map(i => `<div>${i.name} (¥${i.price})</div>`).join('')}
              </div>
            `;
            container.appendChild(card);
          }
        });
      });
    }

    checkPendingPayPayOrder();
    listenMyOrders();
  </script>
</body>
</html>
