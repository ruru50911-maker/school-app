<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食モバイル注文</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen pb-24">

  <!-- ヘッダー -->
  <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg">🍱 学食オンライン注文</h1>
      <p class="text-xs text-emerald-100">スマホで事前注文＆受け取り</p>
    </div>
    <!-- 営業状態バッジ -->
    <div id="storeStatusBadge" class="text-xs px-3 py-1 rounded-full font-bold bg-gray-400 text-white">
      確認中...
    </div>
  </header>

  <!-- 営業時間外のアラート（準備中のみ表示） -->
  <div id="closedBanner" class="hidden bg-amber-500 text-white text-xs font-bold p-3 text-center shadow-inner">
    ⚠️ ただいま営業時間外のため、ご注文を受け付けできません。
  </div>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- アクティブな注文ステータス (自分の注文がある場合表示) -->
    <section id="myOrderStatus" class="hidden bg-white p-4 rounded-2xl border-2 border-emerald-500 shadow-md space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <span class="text-xs font-bold text-gray-500">現在の注文状況</span>
        <span id="myOrderNumber" class="text-xl font-black text-emerald-600">#---</span>
      </div>
      <div class="text-center py-2">
        <div id="myStatusBadge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-orange-100 text-orange-800">
          調理中...
        </div>
        <p id="myStatusDesc" class="text-xs text-gray-500 mt-2">出来上がると画面と音で通知されます</p>
      </div>
    </section>

    <!-- 生徒情報入力 -->
    <section class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">注文者情報</h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">組 / 席番号</label>
          <input type="text" id="studentClass" placeholder="例: 2-A" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">お名前</label>
          <input type="text" id="studentName" placeholder="例: 山田" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>
    </section>

    <!-- メニュー一覧 -->
    <section class="space-y-3">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">本日のメニュー</h2>
      <div id="menuContainer" class="space-y-3">
        <p class="text-xs text-gray-400 text-center py-6">メニューを読み込み中...</p>
      </div>
    </section>

  </main>

  <!-- カート・注文バー (画面下部固定) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg z-30">
    <div class="max-w-md mx-auto flex justify-between items-center gap-3">
      <div>
        <div class="text-xs text-gray-400 font-bold">合計金額</div>
        <div id="totalPrice" class="text-xl font-black text-emerald-600">¥0</div>
      </div>
      <button id="submitOrderBtn" disabled onclick="window.submitOrder()" class="flex-1 bg-gray-300 text-gray-500 font-bold py-3 px-4 rounded-xl text-sm transition shadow-md disabled:cursor-not-allowed">
        営業時間外
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ53Gowy1BoIXT5nGLC_MdFJ3vpfqiGp0",
      authDomain: "school-order-app.firebaseapp.com",
      databaseURL: "https://school-order-app-default-rtdb.firebaseio.com",
      projectId: "school-order-app",
      storageBucket: "school-order-app.firebasestorage.app",
      messagingSenderId: "1030918225373",
      appId: "1:1030918225373:web:353c77fecd49d4a94f8a34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cart = {}; // { menuId: { name, price, count } }
    let isStoreOpen = false;
    let menuData = {};
    let activeOrderId = localStorage.getItem('activeOrderId') || null;

    // --- 1. 営業状態の監視 ---
    onValue(ref(db, 'storeStatus/isOpen'), (snapshot) => {
      isStoreOpen = snapshot.val() || false;
      const statusBadge = document.getElementById('storeStatusBadge');
      const closedBanner = document.getElementById('closedBanner');

      if (isStoreOpen) {
        statusBadge.innerText = "● 営業中";
        statusBadge.className = "text-xs px-3 py-1 rounded-full font-bold bg-emerald-800 text-emerald-100";
        closedBanner.classList.add('hidden');
      } else {
        statusBadge.innerText = "準備中";
        statusBadge.className = "text-xs px-3 py-1 rounded-full font-bold bg-gray-500 text-white";
        closedBanner.classList.remove('hidden');
      }
      updateCartUI();
    });

    // --- 2. メニューのリアルタイム表示 ---
    onValue(ref(db, 'menu'), (snapshot) => {
      menuData = snapshot.val() || {};
      renderMenu();
    });

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      const keys = Object.keys(menuData);

      if (keys.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">現在登録されている商品はありません。</p>';
        return;
      }

      container.innerHTML = keys.map(id => {
        const item = menuData[id];
        const isSoldOut = item.isSoldOut || false;
        const count = cart[id] ? cart[id].count : 0;

        return `
          <div class="bg-white p-3.5 rounded-2xl border shadow-sm flex justify-between items-center ${isSoldOut ? 'opacity-60 bg-gray-50' : ''}">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${item.emoji || '🍱'}</span>
              <div>
                <div class="font-bold text-gray-800 text-sm">${item.name}</div>
                <div class="text-xs font-mono font-bold text-emerald-600">¥${item.price.toLocaleString()}</div>
              </div>
            </div>
            
            ${isSoldOut ? `
              <span class="text-xs font-bold text-red-500 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200">売り切れ</span>
            ` : `
              <div class="flex items-center gap-2">
                ${count > 0 ? `
                  <button onclick="window.changeQuantity('${id}', -1)" class="w-8 h-8 bg-gray-100 font-bold text-gray-700 rounded-xl hover:bg-gray-200 flex items-center justify-center">-</button>
                  <span class="font-bold text-sm min-w-[16px] text-center">${count}</span>
                ` : ''}
                <button onclick="window.changeQuantity('${id}', 1)" class="w-8 h-8 bg-emerald-600 font-bold text-white rounded-xl hover:bg-emerald-700 flex items-center justify-center shadow">+</button>
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    // カート操作
    window.changeQuantity = (id, delta) => {
      if (!isStoreOpen) {
        alert("ただいま営業時間外のため注文できません。");
        return;
      }

      const item = menuData[id];
      if (!item) return;

      if (!cart[id]) {
        cart[id] = { id, name: item.name, price: item.price, count: 0 };
      }

      cart[id].count += delta;

      if (cart[id].count <= 0) {
        delete cart[id];
      }

      renderMenu();
      updateCartUI();
    };

    // UI & ボタン状態の更新
    function updateCartUI() {
      const totalPriceEl = document.getElementById('totalPrice');
      const submitBtn = document.getElementById('submitOrderBtn');

      const total = Object.values(cart).reduce((sum, item) => sum + (item.price * item.count), 0);
      const totalCount = Object.values(cart).reduce((sum, item) => sum + item.count, 0);

      totalPriceEl.innerText = `¥${total.toLocaleString()}`;

      if (!isStoreOpen) {
        submitBtn.disabled = true;
        submitBtn.innerText = "営業時間外";
        submitBtn.className = "flex-1 bg-gray-300 text-gray-500 font-bold py-3 px-4 rounded-xl text-sm cursor-not-allowed";
      } else if (totalCount === 0) {
        submitBtn.disabled = true;
        submitBtn.innerText = "商品を選択してください";
        submitBtn.className = "flex-1 bg-gray-300 text-gray-500 font-bold py-3 px-4 rounded-xl text-sm cursor-not-allowed";
      } else {
        submitBtn.disabled = false;
        submitBtn.innerText = `注文を確定する (${totalCount}点)`;
        submitBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-md";
      }
    }

    // --- 3. 注文送信処理 ---
    window.submitOrder = async () => {
      if (!isStoreOpen) {
        alert("申し訳ありません。ただいま営業時間外です。");
        return;
      }

      const studentClass = document.getElementById('studentClass').value.trim();
      const studentName = document.getElementById('studentName').value.trim();

      if (!studentClass || !studentName) {
        alert("「組 / 席番号」と「お名前」を入力してください。");
        return;
      }

      const cartItems = [];
      Object.values(cart).forEach(item => {
        for (let i = 0; i < item.count; i++) {
          cartItems.push({ name: item.name, price: item.price });
        }
      });

      if (cartItems.length === 0) return;

      const submitBtn = document.getElementById('submitOrderBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "送信中...";

      try {
        // カウンターのアトミックインクリメント (連番採番)
        const counterRef = ref(db, 'orderCounter');
        const countResult = await runTransaction(counterRef, (currentValue) => {
          return (currentValue || 0) + 1;
        });

        const num = countResult.snapshot.val();

        // 学年に応じた接頭辞（1年: A-, 2年: B-, 3年: C-）を設定
        let prefix = "A-";
        const gradeMatch = studentClass.match(/[1-3１-３]/);
        if (gradeMatch) {
          const grade = gradeMatch[0];
          if (grade === "2" || grade === "２") prefix = "B-";
          if (grade === "3" || grade === "３") prefix = "C-";
        }

        const formattedOrderNumber = `${prefix}#${String(num).padStart(3, '0')}`;

        // 注文データの保存
        const newOrderRef = push(ref(db, 'orders'));
        const orderData = {
          orderNumber: formattedOrderNumber,
          studentInfo: `${studentClass} ${studentName}`,
          status: 'preparing',
          items: cartItems,
          paymentMethod: '現地決済',
          timestamp: Date.now()
        };

        await set(newOrderRef, orderData);

        // 状態のリセット＆アクティブ注文の保持
        activeOrderId = newOrderRef.key;
        localStorage.setItem('activeOrderId', activeOrderId);
        cart = {};
        renderMenu();
        updateCartUI();
        watchMyOrder(activeOrderId);

        alert(`ご注文が完了しました！\n注文番号: ${formattedOrderNumber}`);

      } catch (error) {
        alert("注文の送信に失敗しました: " + error.message);
        updateCartUI();
      }
    };

    // --- 4. 自分の注文状態の監視 ---
    function watchMyOrder(orderId) {
      if (!orderId) return;

      onValue(ref(db, `orders/${orderId}`), (snapshot) => {
        const order = snapshot.val();
        const container = document.getElementById('myOrderStatus');

        if (!order) {
          container.classList.add('hidden');
          localStorage.removeItem('activeOrderId');
          return;
        }

        container.classList.remove('hidden');
        document.getElementById('myOrderNumber').innerText = order.orderNumber;

        const badge = document.getElementById('myStatusBadge');
        const desc = document.getElementById('myStatusDesc');

        if (order.status === 'preparing') {
          badge.innerText = "🍳 調理中...";
          badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-orange-100 text-orange-800";
          desc.innerText = "学食スタッフが準備しています。しばらくお待ちください。";
        } else if (order.status === 'ready') {
          badge.innerText = "🔔 出来上がりました！受け取ってください";
          badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-green-500 text-white animate-bounce";
          desc.innerText = "カウンターで画面の注文番号を提示してください。";
        } else if (order.status === 'completed') {
          badge.innerText = "✅ 提供完了";
          badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-gray-200 text-gray-700";
          desc.innerText = "ありがとうございました！";
          setTimeout(() => {
            container.classList.add('hidden');
            localStorage.removeItem('activeOrderId');
          }, 5000);
        }
      });
    }

    // 初期化時の注文追跡
    if (activeOrderId) {
      watchMyOrder(activeOrderId);
    }
  </script>
</body>
</html>
