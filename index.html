<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食モバイルオーダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { animation: { 'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite' } } }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

  <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
    <h1 class="font-bold text-lg md:text-xl">🍱 学食モバイルオーダー</h1>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24">
    <div id="activeOrderCard" class="hidden mb-6"></div>

    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-6">
      <h2 class="text-md font-bold mb-3 text-gray-800">👤 利用者情報（必須）</h2>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">学年</label>
          <select id="gradeSelect" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-bold"></select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">クラス</label>
          <select id="classSelect" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-bold"></select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">出席番号</label>
          <select id="numberSelect" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-bold"></select>
        </div>
      </div>
    </div>

    <div id="menuSection">
      <h2 class="text-lg font-bold mb-3 text-gray-800">🍱 メニュー選択</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="menuList"></div>
    </div>
  </main>

  <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-2xl z-40 hidden">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500" id="cartCount">合計 0 点</p>
        <p class="text-xl font-bold text-blue-600" id="cartTotal">¥0</p>
      </div>
      <button id="orderBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md">
        注文を確定する
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ53Gowy1BoIXT5nGLC_MdFJ3vpfqiGp0",
      authDomain: "school-order-app.firebaseapp.com",
      databaseURL: "https://school-order-app-default-rtdb.firebaseio.com",
      projectId: "school-order-app",
      storageBucket: "school-order-app.firebasestorage.app",
      messagingSenderId: "1030918225373",
      appId: "1:1030918225373:web:353c77fecd49d4a94f8a34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const MENU_ITEMS = [
      { id: 1, name: '日替わり定食', price: 500, emoji: '🍱' },
      { id: 2, name: '醤油ラーメン', price: 450, emoji: '🍜' },
      { id: 3, name: '特製カレーライス', price: 400, emoji: '🍛' },
      { id: 4, name: 'カツ丼', price: 550, emoji: '🍚' },
    ];

    let cart = [];
    let myOrderId = localStorage.getItem('firebase_student_order_id');

    const gradeSel = document.getElementById('gradeSelect');
    const classSel = document.getElementById('classSelect');
    const numSel = document.getElementById('numberSelect');
    for (let i = 1; i <= 3; i++) gradeSel.innerHTML += `<option value="${i}">${i}年</option>`;
    for (let i = 1; i <= 9; i++) classSel.innerHTML += `<option value="${i}">${i}組</option>`;
    for (let i = 1; i <= 42; i++) numSel.innerHTML += `<option value="${i}">${i}番</option>`;

    const list = document.getElementById('menuList');
    list.innerHTML = MENU_ITEMS.map(item => `
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-3xl">${item.emoji}</span>
          <div>
            <p class="font-bold text-gray-800">${item.name}</p>
            <p class="text-blue-600 font-semibold">¥${item.price}</p>
          </div>
        </div>
        <button onclick="window.addToCart(${item.id})" class="bg-blue-50 text-blue-600 font-bold px-4 py-2 rounded-lg text-sm">
          ＋ 追加
        </button>
      </div>
    `).join('');

    window.addToCart = (itemId) => {
      const item = MENU_ITEMS.find(i => i.id === itemId);
      if (item) { cart.push(item); updateCartUI(); }
    };

    function updateCartUI() {
      const bar = document.getElementById('cartBar');
      if (cart.length === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      document.getElementById('cartCount').innerText = `合計 ${cart.length} 点`;
      document.getElementById('cartTotal').innerText = `¥${cart.reduce((sum, item) => sum + item.price, 0)}`;
    }

    document.getElementById('orderBtn').addEventListener('click', () => {
      if (cart.length === 0) return;

      const orderNum = 'A-' + Math.floor(100 + Math.random() * 900);
      const newOrder = {
        orderNumber: orderNum,
        studentInfo: `${gradeSel.value}年${classSel.value}組${numSel.value}番`,
        items: cart,
        status: 'preparing',
        timestamp: Date.now()
      };

      const newOrderRef = push(ref(db, 'orders'), newOrder);
      myOrderId = newOrderRef.key;
      localStorage.setItem('firebase_student_order_id', myOrderId);

      cart = [];
      updateCartUI();
      listenMyOrder();
    });

    function listenMyOrder() {
      if (!myOrderId) return;
      onValue(ref(db, `orders/${myOrderId}`), (snapshot) => {
        const order = snapshot.val();
        const card = document.getElementById('activeOrderCard');

        if (!order || order.status === 'completed') {
          card.className = "hidden";
          return;
        }

        card.className = "block";
        const isReady = order.status === 'ready';
        card.innerHTML = `
          <div class="rounded-2xl p-6 text-center border shadow-lg ${isReady ? 'bg-green-50 border-green-400 text-green-900 animate-pulse-fast' : 'bg-white border-blue-200'}">
            <p class="text-xs text-gray-500 mb-1">注文者：${order.studentInfo}</p>
            <h3 class="text-xl font-bold mb-3 ${isReady ? 'text-green-700' : 'text-blue-600'}">
              ${isReady ? '🎉 料理の準備ができました！' : '⏳ 調理中です...'}
            </h3>
            <div class="inline-block bg-white px-6 py-3 rounded-2xl shadow-inner mb-4 border">
              <span class="text-xs text-gray-400 block">受取番号</span>
              <span class="text-5xl font-black ${isReady ? 'text-green-600' : 'text-gray-800'}">${order.orderNumber}</span>
            </div>
          </div>
        `;
      });
    }

    listenMyOrder();
  </script>
</body>
</html>
