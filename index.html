<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食注文</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen p-4">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-4">
    <h1 class="text-lg font-bold mb-4 text-center border-b pb-2">🍔 学食メニュー</h1>
    <div id="menuList" class="space-y-3">
      <p class="text-xs text-gray-400 text-center">メニューを読み込み中...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ53Gowy1BoIXT5nGLC_MdFJ3vpfqiGp0",
      authDomain: "school-order-app.firebaseapp.com",
      databaseURL: "https://school-order-app-default-rtdb.firebaseio.com",
      projectId: "school-order-app",
      storageBucket: "school-order-app.firebasestorage.app",
      messagingSenderId: "1030918225373",
      appId: "1:1030918225373:web:353c77fecd49d4a94f8a34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // メニューのリアルタイム受信処理
    onValue(ref(db, 'menu'), (snapshot) => {
      const data = snapshot.val() || {};
      const menuContainer = document.getElementById('menuList');
      const menuKeys = Object.keys(data);

      if (menuKeys.length === 0) {
        menuContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">現在メニューはありません。</p>';
        return;
      }

      menuContainer.innerHTML = menuKeys.map(key => {
        const item = data[key];
        const emoji = item.emoji || '🍱'; // アイコンを取得

        return `
          <div class="p-3 border rounded-lg flex items-center justify-between ${item.isSoldOut ? 'bg-gray-100 opacity-60' : 'bg-white'}">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${emoji}</span>
              <div>
                <div class="font-bold text-sm text-gray-800">${item.name}</div>
                <div class="text-xs text-gray-500">¥${item.price}</div>
              </div>
            </div>
            ${item.isSoldOut ? '<span class="text-xs text-red-500 font-bold">売り切れ</span>' : ''}
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
