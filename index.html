<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食モバイルオーダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      <h1 class="font-bold text-lg md:text-xl">学食モバイルオーダー</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="viewToggleBtn" onclick="toggleView()" class="bg-blue-800 hover:bg-blue-900 text-white text-xs md:text-sm px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
        <span>🔄 スタッフ画面へ切替</span>
      </button>
    </div>
  </header>

  <!-- Main Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24">

    <!-- STUDENT VIEW -->
    <div id="studentView" class="space-y-6">
      
      <!-- Active Order Status Banner -->
      <div id="activeOrderCard" class="hidden"></div>

      <!-- Menu Selection Section -->
      <div id="menuSection">
        <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-gray-800">
          <span>🍱 メニュー選択</span>
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="menuList"></div>
      </div>

    </div>

    <!-- STAFF VIEW -->
    <div id="staffView" class="hidden space-y-6">
      <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded text-xs md:text-sm text-amber-800 mb-4">
        💡 <strong>デモ用ヒント:</strong> 「生徒画面」で注文すると、ここにリアルタイムで反映されます。
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Preparing Column -->
        <section class="bg-white p-4 rounded-xl border shadow-sm">
          <h2 class="text-md font-bold mb-3 text-orange-600 flex items-center justify-between">
            <span class="flex items-center gap-2">🍳 調理中</span>
            <span id="countPreparing" class="bg-orange-100 text-orange-800 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </h2>
          <div id="preparingList" class="space-y-3"></div>
        </section>

        <!-- Ready Column -->
        <section class="bg-white p-4 rounded-xl border shadow-sm">
          <h2 class="text-md font-bold mb-3 text-green-600 flex items-center justify-between">
            <span class="flex items-center gap-2">🔔 呼び出し中</span>
            <span id="countReady" class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </h2>
          <div id="readyList" class="space-y-3"></div>
        </section>
      </div>
    </div>

  </main>

  <!-- Sticky Cart Footer for Student -->
  <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-2xl z-40 hidden">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500" id="cartCount">合計 0 点</p>
        <p class="text-xl font-bold text-blue-600" id="cartTotal">¥0</p>
      </div>
      <button onclick="placeOrder()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-6 py-2.5 rounded-xl font-bold shadow-md transition">
        注文を確定する
      </button>
    </div>
  </div>

  <script>
    const MENU_ITEMS = [
      { id: 1, name: '日替わり定食', price: 500, category: '定食', emoji: '🍱' },
      { id: 2, name: '醤油ラーメン', price: 450, category: '麺類', emoji: '🍜' },
      { id: 3, name: '特製カレーライス', price: 400, category: 'カレー', emoji: '🍛' },
      { id: 4, name: 'カツ丼', price: 550, category: '丼物', emoji: '🍚' },
    ];

    let currentView = 'student';
    let orders = [];
    let cart = [];
    let orderCounter = 1;

    // Render Menu List
    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = MENU_ITEMS.map(item => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center hover:border-blue-300 transition">
          <div class="flex items-center gap-3">
            <span class="text-3xl">${item.emoji}</span>
            <div>
              <p class="font-bold text-gray-800">${item.name}</p>
              <p class="text-blue-600 font-semibold">¥${item.price}</p>
            </div>
          </div>
          <button onclick="addToCart(${item.id})" class="bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-4 py-2 rounded-lg text-sm transition">
            ＋ 追加
          </button>
        </div>
      `).join('');
    }

    function addToCart(itemId) {
      const item = MENU_ITEMS.find(i => i.id === itemId);
      if (item) {
        cart.push(item);
        updateCartUI();
      }
    }

    function updateCartUI() {
      const bar = document.getElementById('cartBar');
      if (cart.length === 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('cartCount').innerText = `合計 ${cart.length} 点`;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cartTotal').innerText = `¥${total}`;
    }

    function placeOrder() {
      if (cart.length === 0) return;

      const numStr = orderCounter.toString().padStart(3, '0');
      const newOrder = {
        id: 'ord_' + Date.now(),
        orderNumber: `A-${numStr}`,
        items: [...cart],
        total: cart.reduce((sum, i) => sum + i.price, 0),
        status: 'preparing', // 'preparing' | 'ready' | 'completed'
        timestamp: new Date()
      };

      orderCounter++;
      orders.push(newOrder);
      cart = [];
      updateCartUI();
      renderAll();

      alert(`注文が確定しました！\n受取番号: ${newOrder.orderNumber}`);
    }

    function updateStatus(orderId, newStatus) {
      const ord = orders.find(o => o.id === orderId);
      if (ord) {
        ord.status = newStatus;
        renderAll();
      }
    }

    function renderStudentView() {
      const card = document.getElementById('activeOrderCard');
      const activeOrder = orders.find(o => o.status !== 'completed');

      if (!activeOrder) {
        card.className = "hidden";
        card.innerHTML = "";
        return;
      }

      card.className = "block transition-all";
      const isReady = activeOrder.status === 'ready';

      card.innerHTML = `
        <div class="rounded-2xl p-6 text-center border shadow-lg transition-all ${
          isReady 
            ? 'bg-green-50 border-green-400 text-green-900 animate-pulse-fast' 
            : 'bg-white border-blue-200 text-gray-800'
        }">
          <p class="text-xs font-semibold text-gray-500 mb-1">現在の注文状況</p>
          <h3 class="text-xl font-bold mb-3 ${isReady ? 'text-green-700' : 'text-blue-600'}">
            ${isReady ? '🎉 料理の準備ができました！' : '⏳ 調理中です...'}
          </h3>

          <div class="inline-block bg-white px-6 py-3 rounded-2xl shadow-inner mb-4 border border-gray-100">
            <span class="text-xs text-gray-400 block mb-0.5">受取番号</span>
            <span class="text-5xl font-black tracking-wider ${isReady ? 'text-green-600' : 'text-gray-800'}">
              ${activeOrder.orderNumber}
            </span>
          </div>

          <div class="bg-gray-50 rounded-xl p-3 max-w-xs mx-auto text-left text-xs text-gray-600 border border-gray-200 mb-3">
            <p class="font-bold border-b pb-1 mb-1 text-gray-700">注文内容</p>
            ${activeOrder.items.map(i => `<div class="flex justify-between py-0.5"><span>${i.name}</span><span>¥${i.price}</span></div>`).join('')}
          </div>

          ${isReady ? `
            <div class="bg-green-600 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-md animate-bounce">
              食堂カウンターでこの画面（番号）を見せて受け取ってください
            </div>
          ` : `
            <p class="text-xs text-gray-500">呼び出しまでそのままお待ちください</p>
          `}
        </div>
      `;
    }

    function renderStaffView() {
      const preparingContainer = document.getElementById('preparingList');
      const readyContainer = document.getElementById('readyList');

      const preparingOrders = orders.filter(o => o.status === 'preparing');
      const readyOrders = orders.filter(o => o.status === 'ready');

      document.getElementById('countPreparing').innerText = preparingOrders.length;
      document.getElementById('countReady').innerText = readyOrders.length;

      // Render Preparing
      if (preparingOrders.length === 0) {
        preparingContainer.innerHTML = `<p class="text-xs text-gray-400 py-4 text-center">調理待ちの注文はありません</p>`;
      } else {
        preparingContainer.innerHTML = preparingOrders.map(o => `
          <div class="border-l-4 border-orange-500 bg-orange-50/50 p-3 rounded-r-lg border border-gray-200 shadow-sm">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xl font-black text-gray-800">${o.orderNumber}</span>
              <span class="text-xs text-gray-400">${new Date(o.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="text-xs text-gray-600 mb-3">
              ${o.items.map(i => `<div>・${i.name}</div>`).join('')}
            </div>
            <button onclick="updateStatus('${o.id}', 'ready')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg text-xs shadow transition">
              🔔 呼び出し通知を送る
            </button>
          </div>
        `).join('');
      }

      // Render Ready
      if (readyOrders.length === 0) {
        readyContainer.innerHTML = `<p class="text-xs text-gray-400 py-4 text-center">呼び出し中の注文はありません</p>`;
      } else {
        readyContainer.innerHTML = readyOrders.map(o => `
          <div class="border-l-4 border-green-500 bg-green-50/50 p-3 rounded-r-lg border border-gray-200 shadow-sm">
            <div class="flex justify-between items-center mb-1">
              <span class="text-2xl font-black text-green-700">${o.orderNumber}</span>
              <span class="bg-green-200 text-green-800 text-[10px] font-bold px-2 py-0.5 rounded">受取待ち</span>
            </div>
            <button onclick="updateStatus('${o.id}', 'completed')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg text-xs shadow transition mt-2">
              ✅ 提供完了（リストから消去）
            </button>
          </div>
        `).join('');
      }
    }

    function renderAll() {
      renderStudentView();
      renderStaffView();
    }

    function toggleView() {
      const studentEl = document.getElementById('studentView');
      const staffEl = document.getElementById('staffView');
      const btn = document.getElementById('viewToggleBtn');
      const cartBar = document.getElementById('cartBar');

      if (currentView === 'student') {
        currentView = 'staff';
        studentEl.classList.add('hidden');
        staffEl.classList.remove('hidden');
        cartBar.classList.add('hidden');
        btn.innerHTML = `<span>👤 生徒画面へ切替</span>`;
        btn.className = "bg-emerald-700 hover:bg-emerald-800 text-white text-xs md:text-sm px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1";
      } else {
        currentView = 'student';
        staffEl.classList.add('hidden');
        studentEl.classList.remove('hidden');
        updateCartUI();
        btn.innerHTML = `<span>🔄 スタッフ画面へ切替</span>`;
        btn.className = "bg-blue-800 hover:bg-blue-900 text-white text-xs md:text-sm px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1";
      }
    }

    // Initialize
    renderMenu();
    renderAll();
  </script>
</body>
</html>
