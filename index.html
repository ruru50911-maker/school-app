<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食モバイルオーダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen pb-24">

  <!-- ログイン画面 -->
  <div id="loginModal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="text-center">
        <span class="text-4xl">🍱</span>
        <h2 class="text-xl font-bold text-gray-800 mt-1">学食オーダー ログイン</h2>
        <p class="text-xs text-gray-500 mt-1">学年・クラス・出席番号とPINを入力</p>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <select id="gradeSelect" class="bg-gray-50 border border-gray-300 rounded-xl p-2.5 text-center text-sm font-bold">
          <option value="1">1年</option><option value="2">2年</option><option value="3">3年</option>
        </select>
        <select id="classSelect" class="bg-gray-50 border border-gray-300 rounded-xl p-2.5 text-center text-sm font-bold"></select>
        <select id="numSelect" class="bg-gray-50 border border-gray-300 rounded-xl p-2.5 text-center text-sm font-bold"></select>
      </div>

      <div>
        <input type="password" id="pinInput" placeholder="4桁暗証番号(PIN)" maxlength="4" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-center text-lg font-bold tracking-widest">
      </div>

      <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
        ログインして注文へ
      </button>
    </div>
  </div>

  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg">学食オーダー</h1>
      <span id="userDisplay" class="text-xs text-blue-100 block">未ログイン</span>
    </div>
    <!-- 【2-1】リアルタイム待ち時間インジケーター -->
    <div class="bg-blue-700/80 px-3 py-1.5 rounded-xl text-right">
      <span class="text-[10px] text-blue-200 block">現在の待ち状況</span>
      <span id="waitTimeBadge" class="text-xs font-bold">待ち 0名 (約0分)</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- 営業時間外ロック表示 -->
    <div id="closedNotice" class="hidden bg-red-100 border border-red-300 text-red-800 p-4 rounded-xl text-center font-bold text-sm">
      ⚠️ 現在は営業時間外です。注文を受け付けておりません。
    </div>

    <!-- 【2-3】リピート注文エリア -->
    <section id="repeatSection" class="hidden space-y-2">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">⭐️ 前回の注文からリピート</h2>
      <div id="repeatCard" class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-3 rounded-xl flex justify-between items-center">
        <div>
          <span id="repeatName" class="text-sm font-bold text-amber-900 block">-</span>
          <span id="repeatPrice" class="text-xs text-amber-700">¥0</span>
        </div>
        <button id="repeatBtn" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow">
          1タップ追加
        </button>
      </div>
    </section>

    <!-- メニュー一覧 -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold text-gray-700">本日のメニュー一覧</h2>
      <div id="menuContainer" class="space-y-3"></div>
    </section>

    <!-- 自分の注文状況・呼び出し通知ステータス -->
    <section class="space-y-2">
      <h2 class="text-sm font-bold text-gray-700">自分の注文ステータス</h2>
      <div id="myOrdersContainer" class="space-y-2"></div>
    </section>

  </main>

  <!-- カート / 決済フッター -->
  <footer id="cartFooter" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-lg z-30 max-w-md mx-auto">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs text-gray-500">カート内: <span id="cartCount" class="font-bold text-gray-800">0</span> 点</span>
      <span class="text-lg font-black text-blue-600">合計 <span id="cartTotal">¥0</span></span>
    </div>
    <button id="checkoutBtn" disabled class="w-full bg-gray-300 text-white font-bold py-3 rounded-xl transition shadow">
      注文を確定する
    </button>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ53Gowy1BoIXT5nGLC_MdFJ3vpfqiGp0",
      authDomain: "school-order-app.firebaseapp.com",
      databaseURL: "https://school-order-app-default-rtdb.firebaseio.com",
      projectId: "school-order-app",
      storageBucket: "school-order-app.firebasestorage.app",
      messagingSenderId: "1030918225373",
      appId: "1:1030918225373:web:353c77fecd49d4a94f8a34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const MENUS = [
      { id: "m1", name: "日替わり学食定食", price: 450, options: ["普通盛り", "ご飯大盛り (+50円)"] },
      { id: "m2", name: "特製カレーライス", price: 380, options: ["普通盛り", "ご飯大盛り (+50円)", "福神漬け抜き"] },
      { id: "m3", name: "自家製醤油ラーメン", price: 400, options: ["普通麺", "大盛り (+50円)", "ネギ抜き"] },
      { id: "m4", name: "きつねうどん・そば", price: 320, options: ["うどん", "そば"] }
    ];

    let currentUser = null;
    let cart = [];
    let stockData = {};
    let systemIsOpen = true;

    // Web Notification 許可要求 【2-5】
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    // 初期化（クラス・番号ドロップダウン）
    const classSelect = document.getElementById('classSelect');
    const numSelect = document.getElementById('numSelect');
    for (let i = 1; i <= 9; i++) classSelect.innerHTML += `<option value="${i}">${i}組</option>`;
    for (let i = 1; i <= 42; i++) numSelect.innerHTML += `<option value="${i}">${i}番</option>`;

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const g = document.getElementById('gradeSelect').value;
      const c = document.getElementById('classSelect').value;
      const n = document.getElementById('numSelect').value;
      const pin = document.getElementById('pinInput').value;
      const key = `${g}_${c}_${n}`;

      const snapshot = await get(ref(db, `registeredUsers/${key}`));
      if (!snapshot.exists() || snapshot.val().pin !== pin) {
        alert('学籍番号または暗証番号(PIN)が正しくありません。');
        return;
      }

      currentUser = { key, info: `${g}年${c}組${n}番` };
      document.getElementById('userDisplay').innerText = currentUser.info;
      document.getElementById('loginModal').classList.add('hidden');

      loadUserData();
    });

    // 在庫状況と時間制限の監視 【1-2 / 1-5】
    onValue(ref(db, 'menuStock'), s => { stockData = s.val() || {}; renderMenus(); });
    onValue(ref(db, 'systemSettings'), s => {
      if (s.exists()) {
        const set = s.val();
        if (set.timeEnabled) {
          const now = new Date();
          const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
          systemIsOpen = (currentTime >= set.startTime && currentTime <= set.endTime);
        } else { systemIsOpen = true; }
      }
      document.getElementById('closedNotice').classList.toggle('hidden', systemIsOpen);
      renderMenus();
    });

    // 待ち人数のリアルタイム集計 【2-1】
    onValue(ref(db, 'orders'), s => {
      const orders = s.val() || {};
      const activeOrders = Object.values(orders).filter(o => o.status === 'cooking');
      const waitCount = activeOrders.length;
      const waitTime = waitCount * 3; // 1件につき約3分計算
      document.getElementById('waitTimeBadge').innerText = `待ち ${waitCount}名 (約${waitTime}分)`;

      renderMyOrders(orders);
    });

    // 【2-2】メニューとオプションの描画
    function renderMenus() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      MENUS.forEach(menu => {
        const isAvailable = (stockData[menu.id] !== false) && systemIsOpen;
        const card = document.createElement('div');
        card.className = `bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3 ${!isAvailable ? 'opacity-50' : ''}`;

        let optHtml = '';
        if (menu.options && isAvailable) {
          optHtml = `
            <select id="opt-${menu.id}" class="w-full bg-gray-50 border border-gray-200 text-xs rounded-lg p-2 font-bold text-gray-700">
              ${menu.options.map(o => `<option value="${o}">${o}</option>`).join('')}
            </select>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div>
              <h3 class="font-bold text-gray-800">${menu.name}</h3>
              <span class="text-sm font-black text-blue-600">¥${menu.price}</span>
            </div>
            ${!isAvailable ? '<span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded">売り切れ</span>' : ''}
          </div>
          ${optHtml}
          <button onclick="window.addToCart('${menu.id}')" ${!isAvailable ? 'disabled' : ''} class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white text-xs font-bold py-2 rounded-lg transition shadow">
            カートに追加する
          </button>
        `;
        container.appendChild(card);
      });
    }

    // カート追加
    window.addToCart = (menuId) => {
      const menu = MENUS.find(m => m.id === menuId);
      const optSelect = document.getElementById(`opt-${menuId}`);
      const selectedOpt = optSelect ? optSelect.value : "";
      let price = menu.price;
      if (selectedOpt.includes("+50円")) price += 50;

      cart.push({ name: menu.name, price, option: selectedOpt });
      updateCartUI();
    };

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      const total = cart.reduce((sum, i) => sum + i.price, 0);
      document.getElementById('cartTotal').innerText = `¥${total}`;
      const checkoutBtn = document.getElementById('checkoutBtn');
      checkoutBtn.disabled = cart.length === 0 || !systemIsOpen;
      checkoutBtn.className = `w-full font-bold py-3 rounded-xl transition shadow ${cart.length > 0 && systemIsOpen ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-gray-300 text-white'}`;
    }

    // 注文確定
    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      if (!currentUser || cart.length === 0) return;
      const orderNumber = Math.floor(100 + Math.random() * 900);

      const orderData = {
        studentKey: currentUser.key,
        studentInfo: currentUser.info,
        orderNumber,
        items: cart,
        status: 'cooking',
        timestamp: Date.now()
      };

      await push(ref(db, 'orders'), orderData);
      localStorage.setItem('lastOrder', JSON.stringify(cart[0])); // 【2-3】リピート記憶
      cart = [];
      updateCartUI();
      alert(`ご注文が完了しました！受取番号: ${orderNumber}`);
      loadUserData();
    });

    // 【2-3】リピート表示
    function loadUserData() {
      const last = localStorage.getItem('lastOrder');
      if (last) {
        const item = JSON.parse(last);
        document.getElementById('repeatSection').classList.remove('hidden');
        document.getElementById('repeatName').innerText = `${item.name} (${item.option || '標準'})`;
        document.getElementById('repeatPrice').innerText = `¥${item.price}`;
        document.getElementById('repeatBtn').onclick = () => {
          cart.push(item);
          updateCartUI();
        };
      }
    }

    // 【2-5】自分の注文状況表示・呼出通知
    function renderMyOrders(allOrders) {
      if (!currentUser) return;
      const container = document.getElementById('myOrdersContainer');
      container.innerHTML = '';

      const myOrders = Object.values(allOrders).filter(o => o.studentKey === currentUser.key && o.status !== 'completed' && o.status !== 'cancelled');

      myOrders.forEach(o => {
        const isReady = o.status === 'ready';

        if (isReady && Notification.permission === "granted") {
          new Notification("学食お呼び出し", { body: `受取番号 ${o.orderNumber} 番のお料理が準備できました！窓口へお越しください。` });
        }

        const div = document.createElement('div');
        div.className = `p-4 rounded-xl border shadow-sm ${isReady ? 'bg-emerald-50 border-emerald-400 animate-pulse' : 'bg-white border-gray-200'}`;
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <div>
              <span class="text-xs text-gray-400 block">受取番号</span>
              <span class="text-2xl font-black text-gray-800">#${o.orderNumber}</span>
            </div>
            <span class="text-xs font-bold px-3 py-1 rounded-full ${isReady ? 'bg-emerald-600 text-white' : 'bg-amber-100 text-amber-800'}">
              ${isReady ? '🔔 呼出中！窓口へお越しください' : '🍳 調理中'}
            </span>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
